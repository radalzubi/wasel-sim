uber:
  label: Uber Jordan
  type: incumbent
  strategic_threat: extreme
  notes:
    - Largest rider pool
    - Deep capital reserves
    - Cannot structurally match Wasel flat-fee economics without margin collapse
careem:
  label: Careem Jordan
  type: incumbent
  strategic_threat: extreme
  notes:
    - Operationally similar to Uber post-acquisition
    - Local familiarity but same commission model
jeeny:
  label: Jeeny Jordan
  type: regional_challenger
  strategic_threat: medium
  notes:
    - Present in Jordan consumer app stores
    - Can pressure price-sensitive demand
petra_ride:
  label: Petra Ride
  type: local_player
  strategic_threat: medium
  notes:
    - Named among provisionally licensed smart-app transport providers in Jordan
    - Smaller footprint but locally relevant
taxi_f:
  label: Taxi F
  type: local_player
  strategic_threat: low
  notes:
    - Named among provisionally licensed smart-app transport providers in Jordan
    - Smaller threat than Uber, Careem, and Jeeny
