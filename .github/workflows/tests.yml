name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    defaults:
      run:
        working-directory: simulation_code/wasel_sim
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: simulation_code/wasel_sim/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run every scenario
        run: |
          for scenario in base bear bull stress_low_demand; do
            python main.py run --scenario "$scenario"
          done
      - name: Check the committed report matches the model
        run: |
          python main.py report
          git diff --exit-code -- outputs/simulation_report.md
